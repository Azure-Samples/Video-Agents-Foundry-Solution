# Validates the repository against AI Gallery template Definition of Done (DoD) requirements
# using the microsoft/template-validation-action.
#
# Prerequisites:
#   Run `azd pipeline config` to configure the GitHub repository with the required
#   variables, secrets, and federated credentials for OIDC authentication.

name: Template Validation
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  template_validation_job:
    runs-on: ubuntu-latest
    name: template validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: microsoft/template-validation-action@9f56864b1ddbfb56dd27f3cbc71a00750cdb9a18 # v0.4.3
        id: validation
        env:
          PYTHONUTF8: "1"
          TEMPLATE_VALIDATION_MODE: true
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Project-specific variables (matches main.parameters.json)
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
          CREATE_ROLE_FOR_USER: ${{ vars.CREATE_ROLE_FOR_USER }}
          KUBERNETES_VERSION: ${{ vars.KUBERNETES_VERSION }}
          SYSTEM_VM_SIZE: ${{ vars.SYSTEM_VM_SIZE }}
          WORKLOAD_VM_SIZE: ${{ vars.WORKLOAD_VM_SIZE }}
          DEEPSTREAM_GPU_VM_SIZE: ${{ vars.DEEPSTREAM_GPU_VM_SIZE }}
          INFERENCE_GPU_VM_SIZE: ${{ vars.INFERENCE_GPU_VM_SIZE }}
          DEEPSTREAM_GPU_MAX_NODE_COUNT: ${{ vars.DEEPSTREAM_GPU_MAX_NODE_COUNT }}
          CREATE_FOUNDRY_PROJECT: ${{ vars.CREATE_FOUNDRY_PROJECT }}
          AI_MODEL_NAME: ${{ vars.AI_MODEL_NAME }}
          AI_MODEL_VERSION: ${{ vars.AI_MODEL_VERSION }}
          AI_MODEL_CAPACITY: ${{ vars.AI_MODEL_CAPACITY }}
          MEDIA_STREAMER_ENABLED: ${{ vars.MEDIA_STREAMER_ENABLED }}
          STORAGE_SKU_NAME: ${{ vars.STORAGE_SKU_NAME }}
          CREATE_IN_LOCAL: "false"
          SKIP_POST_PROVISION: "true"

      - name: print result
        shell: bash
        run: cat ${{ steps.validation.outputs.resultFile }}
