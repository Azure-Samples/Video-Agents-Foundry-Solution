name: Deploy to Azure

# Run when commits are pushed to main
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ── Required Azure identity ─────────────────────────────
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}

      # ── azd environment ─────────────────────────────────────
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      # ── VM sizes (defaults in main.bicepparam if unset) ─────
      SYSTEM_VM_SIZE: ${{ vars.SYSTEM_VM_SIZE }}
      WORKLOAD_VM_SIZE: ${{ vars.WORKLOAD_VM_SIZE }}
      DEEPSTREAM_GPU_VM_SIZE: ${{ vars.DEEPSTREAM_GPU_VM_SIZE }}
      INFERENCE_GPU_VM_SIZE: ${{ vars.INFERENCE_GPU_VM_SIZE }}

      # ── AI Foundry (optional) ───────────────────────────────
      CREATE_FOUNDRY_PROJECT: ${{ vars.CREATE_FOUNDRY_PROJECT }}
      AI_MODEL_NAME: ${{ vars.AI_MODEL_NAME }}
      AI_MODEL_VERSION: ${{ vars.AI_MODEL_VERSION }}
      AI_MODEL_CAPACITY: ${{ vars.AI_MODEL_CAPACITY }}

      # ── Media streamer (optional, defaults to true) ─────────
      MEDIA_STREAMER_ENABLED: ${{ vars.MEDIA_STREAMER_ENABLED }}

      # ── Hook control ────────────────────────────────────────
      CREATE_IN_LOCAL: "false"
      SKIP_POST_PROVISION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      - name: Install helm
        uses: azure/setup-helm@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set Azure subscription
        shell: bash
        run: az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Login to AZD
        shell: bash
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
      - name: Provision
        shell: bash
        run: |
          if ! azd env select "$AZURE_ENV_NAME"; then
            azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          fi
          azd config set defaults.subscription "$AZURE_SUBSCRIPTION_ID"
          azd up --no-prompt
